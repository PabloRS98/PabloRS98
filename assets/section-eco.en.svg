<svg xmlns="http://www.w3.org/2000/svg" width="830" height="160" viewBox="0 0 830 160" role="img" aria-label="Four projects, one idea"><title>Four projects, one idea</title><defs><filter id="m"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="4" seed="7"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0.85 -0.38"/></filter></defs><rect width="830" height="160" fill="#f2eee4"/><rect width="830" height="160" filter="url(#m)" opacity="0.5"/><text x="48" y="44" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="12.5" font-weight="600" letter-spacing="4.4" fill="#17406b" text-anchor="start">THE ECOSYSTEM</text><text x="48" y="86" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="30" font-weight="500" letter-spacing="2" fill="#16130f" text-anchor="start">FOUR PROJECTS, ONE IDEA</text><text x="48" y="118" font-family="'Cormorant Garamond', Garamond, Georgia, serif" font-size="19" font-weight="400" letter-spacing="0" fill="#5e564a" text-anchor="start">Each one removes manual work from a part of daily life: money, training, food and</text><text x="48" y="142" font-family="'Cormorant Garamond', Garamond, Georgia, serif" font-size="19" font-weight="400" letter-spacing="0" fill="#5e564a" text-anchor="start">software development.</text></svg>